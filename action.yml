name: vexproof
description: Write VEX statements for vulnerable npm code that never reached your production bundle.
author: Septakis
branding:
  icon: check-circle
  color: gray-dark

inputs:
  lockfile:
    description: CycloneDX SBOM of the lockfile (e.g. from @cyclonedx/cyclonedx-npm --omit dev)
    required: true
  bundle:
    description: CycloneDX SBOM of the production bundle. Optional when modules or deploy is set.
    required: false
  findings:
    description: npm, pnpm, yarn or bun audit; osv-scanner, Trivy, Grype or Snyk JSON. Omit to query OSV directly.
    required: false
  modules:
    description: vexproof-modules.json from the vexproof/vite or vexproof/webpack plugin, an esbuild metafile, or Angular stats.json. Comma-separated for several.
    required: false
  deploy:
    description: Deployment folders for apps that also run on a server, comma-separated (Next.js .next/standalone,.next/static; Nuxt .output). Needs source maps on.
    required: false
  root:
    description: The folder the build ran in, where node_modules and the build output are (default the workspace). In a monorepo, the app's folder.
    required: false
  browser-only:
    description: Set to true when the VEX covers the browser bundle only (an app that also has a server build); name that artifact with product.
    default: 'false'
  product:
    description: The product's PURL. Defaults to the lockfile SBOM's own component.
    required: false
  out:
    description: CycloneDX VEX output path
    default: vex.cdx.json
  spec-version:
    description: CycloneDX version of the VEX, 1.6 or 1.7. Trivy reads 1.7 from 0.71, Dependency-Track from 4.14.
    default: '1.6'
  openvex:
    description: OpenVEX output path (what Trivy and Grype apply). Empty to skip.
    default: vex.openvex.json
  openvex-package-products:
    description: Set to true when Grype, or a Trivy directory scan (trivy fs), will apply the OpenVEX file. Adds each package as a product; use that file only for this app.
    default: 'false'
  report:
    description: HTML evidence report path (Pro). Empty to skip.
    required: false
  baseline:
    description: Previous release's CycloneDX VEX (Pro)
    required: false
  review-max-age:
    description: "(Pro) Reviews older than this many days need re-confirming (default 365; 0 turns it off)"
    required: false
  rules:
    description: "(Pro) Extra module rules, e.g. from vexproof rules derive"
    required: false
  accept-derived:
    description: "(Pro) Set to true to let derived rules settle findings, not only suggest"
    default: 'false'
  fail-on:
    description: "in_triage, new (needs baseline), or empty for no gate. A finding reviewed exploitable trips either."
  csaf:
    description: "(Pro) CSAF 2.0 VEX output path. Needs csaf-namespace. Empty to skip."
  csaf-namespace:
    description: "(Pro) Your organization's namespace URL for CSAF, e.g. https://acme.example"
  csaf-url:
    description: "(Pro) Canonical URL the CSAF document will be published at"
  csaf-publisher:
    description: "(Pro) Publisher name for CSAF (default the license holder)"
  csaf-id:
    description: "(Pro) CSAF tracking id (default <PRODUCT>-<VERSION>-VEX)"
  csaf-status:
    description: "(Pro) CSAF document status: draft, interim or final (default final)"
  csaf-tlp:
    description: "(Pro) CSAF TLP label: WHITE, GREEN, AMBER or RED (default WHITE)"
  csaf-previous:
    description: "(Pro) The previous revision of the CSAF document, to carry its history forward"
  signing-key:
    description: "(Pro) PEM private key to sign every output with. Pass a secret, e.g. secrets.VEXPROOF_SIGNING_KEY. Ed25519 or ECDSA P-256; vexproof keygen makes one."
  signer:
    description: "(Pro) Name recorded with the signature"
    required: false
  license:
    description: License token. Pass a secret, e.g. secrets.VEXPROOF_LICENSE. Never fails the build if missing or expired.
    required: false
  dependabot:
    description: "(Pro) Set to true to dismiss the Dependabot alerts the VEX settles, and reopen ones vexproof dismissed that it no longer settles. Only a run of the default branch changes alerts; other runs preview. Needs license and dependabot-token. Without a license that covers it, no alerts change and the job continues."
    default: 'false'
  dependabot-token:
    description: A fine-grained token or GitHub App token with Dependabot alerts read and write access to this repository. The workflow's own GITHUB_TOKEN cannot change Dependabot alerts.
    required: false
  dependabot-manifest:
    description: The manifest file or folder whose alerts to change (default the repository root). One, since the action writes one VEX and an alert is judged only by the VEX of its own application.
    required: false
  version:
    description: vexproof version to run from npm. Default is the release this action's tag names (the version in its package.json); pinning a commit runs that release too, so it must be published.
    required: false

outputs:
  vex:
    description: Path of the CycloneDX VEX
    value: ${{ inputs.out }}
  openvex:
    description: Path of the OpenVEX document
    value: ${{ inputs.openvex }}
  csaf:
    description: Path of the CSAF document (Pro)
    value: ${{ inputs.csaf }}

runs:
  using: composite
  steps:
    - name: Run vexproof
      id: vexproof
      shell: bash
      env:
        VEXPROOF_LICENSE: ${{ inputs.license }}
        IN_LOCKFILE: ${{ inputs.lockfile }}
        IN_BUNDLE: ${{ inputs.bundle }}
        IN_FINDINGS: ${{ inputs.findings }}
        IN_MODULES: ${{ inputs.modules }}
        IN_DEPLOY: ${{ inputs.deploy }}
        IN_PRODUCT: ${{ inputs.product }}
        IN_ROOT: ${{ inputs.root }}
        IN_BROWSER_ONLY: ${{ inputs.browser-only }}
        IN_REVIEW_MAX_AGE: ${{ inputs.review-max-age }}
        IN_RULES: ${{ inputs.rules }}
        IN_ACCEPT_DERIVED: ${{ inputs.accept-derived }}
        IN_CSAF_PUBLISHER: ${{ inputs.csaf-publisher }}
        IN_CSAF_ID: ${{ inputs.csaf-id }}
        IN_CSAF_STATUS: ${{ inputs.csaf-status }}
        IN_CSAF_TLP: ${{ inputs.csaf-tlp }}
        IN_CSAF_PREVIOUS: ${{ inputs.csaf-previous }}
        IN_OUT: ${{ inputs.out }}
        IN_OPENVEX: ${{ inputs.openvex }}
        IN_OPENVEX_PACKAGE_PRODUCTS: ${{ inputs.openvex-package-products }}
        IN_SPEC: ${{ inputs.spec-version }}
        IN_REPORT: ${{ inputs.report }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_CSAF: ${{ inputs.csaf }}
        IN_CSAF_NS: ${{ inputs.csaf-namespace }}
        IN_CSAF_URL: ${{ inputs.csaf-url }}
        IN_SIGNING_KEY: ${{ inputs.signing-key }}
        IN_SIGNER: ${{ inputs.signer }}
        IN_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # The version this copy of the action was released as, unless the workflow names another.
        if [ -z "$IN_VERSION" ]; then IN_VERSION="$(node -p "require(process.argv[1]).version" "$ACTION_PATH/package.json")"; fi
        args=(--lockfile "$IN_LOCKFILE" --out "$IN_OUT")
        [ -n "$IN_BUNDLE" ]   && args+=(--bundle "$IN_BUNDLE")
        [ -n "$IN_FINDINGS" ] && args+=(--findings "$IN_FINDINGS")
        [ -n "$IN_MODULES" ]  && args+=(--modules "$IN_MODULES")
        [ -n "$IN_DEPLOY" ]   && args+=(--deploy "$IN_DEPLOY")
        [ -n "$IN_PRODUCT" ]  && args+=(--product "$IN_PRODUCT")
        [ -n "$IN_ROOT" ]     && args+=(--root "$IN_ROOT")
        [ "$IN_BROWSER_ONLY" = "true" ] && args+=(--browser-only)
        [ -n "$IN_REVIEW_MAX_AGE" ] && args+=(--review-max-age "$IN_REVIEW_MAX_AGE")
        [ -n "$IN_RULES" ]    && args+=(--rules "$IN_RULES")
        [ "$IN_ACCEPT_DERIVED" = "true" ] && args+=(--accept-derived)
        [ -n "$IN_OPENVEX" ]  && args+=(--openvex "$IN_OPENVEX")
        [ "$IN_OPENVEX_PACKAGE_PRODUCTS" = "true" ] && args+=(--openvex-package-products)
        [ -n "$IN_SPEC" ]     && args+=(--spec-version "$IN_SPEC")
        [ -n "$IN_REPORT" ]   && args+=(--report "$IN_REPORT")
        [ -n "$IN_BASELINE" ] && args+=(--baseline "$IN_BASELINE")
        [ -n "$IN_FAIL_ON" ]  && args+=(--fail-on "$IN_FAIL_ON")
        [ -n "$IN_CSAF" ]     && args+=(--csaf "$IN_CSAF")
        [ -n "$IN_CSAF_NS" ]  && args+=(--csaf-namespace "$IN_CSAF_NS")
        [ -n "$IN_CSAF_URL" ] && args+=(--csaf-url "$IN_CSAF_URL")
        [ -n "$IN_CSAF_PUBLISHER" ] && args+=(--csaf-publisher "$IN_CSAF_PUBLISHER")
        [ -n "$IN_CSAF_ID" ]  && args+=(--csaf-id "$IN_CSAF_ID")
        [ -n "$IN_CSAF_STATUS" ] && args+=(--csaf-status "$IN_CSAF_STATUS")
        [ -n "$IN_CSAF_TLP" ] && args+=(--csaf-tlp "$IN_CSAF_TLP")
        [ -n "$IN_CSAF_PREVIOUS" ] && args+=(--csaf-previous "$IN_CSAF_PREVIOUS")
        if [ -n "$IN_SIGNING_KEY" ]; then
          keyfile="$(mktemp)"; printf '%s\n' "$IN_SIGNING_KEY" > "$keyfile"; trap 'rm -f "$keyfile"' EXIT
          args+=(--sign "$keyfile")
          [ -n "$IN_SIGNER" ] && args+=(--signer "$IN_SIGNER")
        fi
        status=0
        npx --yes "vexproof@${IN_VERSION}" "${args[@]}" || status=$?
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        exit "$status"

    # Runs when the VEX was written, including when --fail-on stopped the job (exit 1): that is when the alerts
    # matter. Not when the run was cancelled: alerts are not changed by a run someone stopped.
    - name: Apply the VEX to Dependabot alerts
      if: ${{ !cancelled() && inputs.dependabot == 'true' && (steps.vexproof.outputs.status == '0' || steps.vexproof.outputs.status == '1') }}
      shell: bash
      env:
        VEXPROOF_LICENSE: ${{ inputs.license }}
        VEXPROOF_DEPENDABOT_TOKEN: ${{ inputs.dependabot-token }}
        IN_LOCKFILE: ${{ inputs.lockfile }}
        IN_OUT: ${{ inputs.out }}
        IN_MANIFEST: ${{ inputs.dependabot-manifest }}
        IN_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Exit 1 is also what npx gives when it cannot fetch vexproof; then there is no VEX and nothing to apply.
        if [ ! -f "$IN_OUT" ]; then
          echo "vexproof wrote no VEX, so there are no alerts to apply it to"
          exit 0
        fi
        # No token check here: a key that does not cover this feature must not fail the job, and vexproof says
        # so and exits 0. With a covering key and no token, vexproof exits 2 and names the token it needs.
        if [ -z "$IN_VERSION" ]; then IN_VERSION="$(node -p "require(process.argv[1]).version" "$ACTION_PATH/package.json")"; fi
        args=(dependabot --vex "$IN_OUT" --lockfile "$IN_LOCKFILE")
        [ -n "$IN_MANIFEST" ] && args+=(--manifest "$IN_MANIFEST")
        npx --yes "vexproof@${IN_VERSION}" "${args[@]}"

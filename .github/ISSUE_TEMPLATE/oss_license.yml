name: Open-source key request
description: A free vexproof Pro key for a community open-source project
title: "Open-source key: <owner/repo>"
labels: [license]
body:
  - type: markdown
    attributes:
      value: |
        Pro is free for community open-source projects: public repositories under an OSI-approved license, where the project's owners sell no paid edition of it, hosting for it or support for it. A project under a foundation (CNCF, Apache, OWASP) counts, and a maintainer's paid consulting doesn't disqualify a project. A company that sells its open-source product needs a [paid license](https://vexproof.dev/#pricing).

        The key names your repositories and unlocks Pro only when vexproof runs in one of them (checked on the runner from `GITHUB_REPOSITORY`, GitLab's `CI_PROJECT_PATH`, Bitbucket's `BITBUCKET_REPO_FULL_NAME`, or the `origin` remote). It makes no network calls and runs for a year and is renewed on request: open a new request here.

        We reply in this issue with the key. It is safe in public: it only works in the repositories it names.
  - type: textarea
    id: repositories
    attributes:
      label: Repositories
      description: One per line, as `github.com/owner/repo` (or the GitLab / Bitbucket equivalent). Each must be public.
      placeholder: |
        github.com/owner/repo
        github.com/owner/other-repo
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: The SPDX identifier of the repository's license (MIT, Apache-2.0, GPL-3.0-only, …). It has to be [OSI-approved](https://opensource.org/licenses).
      placeholder: Apache-2.0
    validations:
      required: true
  - type: checkboxes
    id: community
    attributes:
      label: Community project
      options:
        - label: The project's owners sell no paid edition of it, hosting for it or support for it.
          required: true
  - type: input
    id: organization
    attributes:
      label: Name on the key
      description: The project or organization name the key should carry; it appears in `vexproof --license` and in `metadata.properties` of every Pro VEX file.
      placeholder: vitejs
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Where vexproof runs (GitHub Actions, GitLab CI, …), which Pro features you're after, or anything we should know.
